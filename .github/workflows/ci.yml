name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build frontend
        run: npm run build
      - name: mock boot smoke
        run: |
          npx tsx src/server/index.ts &
          server_pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4520/api/settings > settings.json; then ok=1; break; fi
            sleep 1
          done
          cat settings.json
          kill "$server_pid" 2>/dev/null || true
          test "$ok" = "1"
          grep -q '"setupComplete":false' settings.json
